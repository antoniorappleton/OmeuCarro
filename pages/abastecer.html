<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="author" content="Antonio Appleton - antonioappleton@gmail.com" />
  <title>L100 – Novo Abastecimento</title>

  <!-- Manifest + PWA -->
  <link rel="manifest" href="../manifest.json?v=32" />
  <meta name="theme-color" content="#102122" />

  <!-- Tema global (mesmo design system do resto da app) -->
  <link rel="stylesheet" href="../css/style.css?v=32" />
  <link rel="stylesheet" href="../css/home.css?v=32" />
  <link rel="stylesheet" href="../css/abastecimentos.css?v=32" />
  <link rel="stylesheet" href="../css/responsive.css?v=32" />
  <script src="../js/core/theme.js?v=32"></script>

  <!-- Material Symbols: usado apenas pelo ícone de "a guardar" (spinner) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      vertical-align: middle;
    }

    .animate-spin {
      animation: abastecer-spin 1s linear infinite;
    }

    @keyframes abastecer-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Firebase v9 (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js?v=32"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js?v=32"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js?v=32"></script>

  <script defer src="../js/core/firebase-config.js?v=32"></script>
  <script defer src="../js/core/auth.js?v=32"></script>
  <script defer src="../js/modules/analytics.js?v=32"></script>
  <script defer src="../js/core/firestore.js?v=32"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js?v=32"></script>
  <script defer src="../js/utils/notifications.js?v=32"></script>
  <script defer src="../js/modules/abastecer.js?v=32"></script>
</head>

<body class="app-page" data-page="abastecer">
  <!-- HEADER -->
  <header class="app-header glass-header">
    <div class="app-header-left">
      <button type="button" onclick="history.back()" class="icon-btn-sm" aria-label="Voltar">
        <svg class="icon" aria-hidden="true">
          <use href="../assets/icons/icons-unified.svg#icon-arrow-left"></use>
        </svg>
      </button>
      <div class="app-header-title">
        <h1 class="header-title-text">Novo abastecimento</h1>
        <span class="header-subtitle-text" id="current-date-display">—</span>
      </div>
    </div>
  </header>

  <main class="home-main has-header-offset">
    <div class="container" style="max-width: 480px; padding-bottom: 24px;">

      <section class="card fuel-form-card">
        <div class="form-field">
          <label for="vehicle-select">
            <svg class="icon icon-sm" aria-hidden="true" style="vertical-align: -3px; margin-right: 6px;">
              <use href="../assets/icons/icons-unified.svg#icon-car"></use>
            </svg>
            Veículo
          </label>
          <select id="vehicle-select">
            <option disabled selected value="">A carregar...</option>
          </select>
        </div>

        <div class="form-field">
          <label for="input-odometer">
            <svg class="icon icon-sm" aria-hidden="true" style="vertical-align: -3px; margin-right: 6px;">
              <use href="../assets/icons/icons-unified.svg#icon-odometer"></use>
            </svg>
            Odómetro (km)
          </label>
          <input id="input-odometer" type="number" inputmode="numeric" placeholder="000.000" />
          <p class="form-helper" id="last-odometer-text">Selecione um veículo...</p>
        </div>

        <div class="form-grid">
          <div class="form-field">
            <label for="input-liters">
              <svg class="icon icon-sm" aria-hidden="true" style="vertical-align: -3px; margin-right: 6px;">
                <use href="../assets/icons/icons-unified.svg#icon-droplet"></use>
              </svg>
              Litros (L)
            </label>
            <input id="input-liters" type="number" step="0.01" inputmode="decimal" placeholder="0.00" />
          </div>

          <div class="form-field">
            <label for="input-total-price">
              <svg class="icon icon-sm" aria-hidden="true" style="vertical-align: -3px; margin-right: 6px;">
                <use href="../assets/icons/icons-unified.svg#icon-wallet"></use>
              </svg>
              Preço total (€)
            </label>
            <input id="input-total-price" type="number" step="0.01" inputmode="decimal" placeholder="0.00" />
          </div>
        </div>

        <p class="form-helper" style="margin-top: -2px; margin-bottom: 18px;">
          <svg class="icon icon-xs" aria-hidden="true" style="vertical-align: -2px; margin-right: 4px;">
            <use href="../assets/icons/icons-unified.svg#icon-location"></use>
          </svg>
          Localização capturada automaticamente
        </p>

        <button id="btn-save" type="button" class="btn btn-primary btn-gradient full-width">
          <svg class="icon icon-left" aria-hidden="true">
            <use href="../assets/icons/icons-unified.svg#icon-check"></use>
          </svg>
          <span>Registar abastecimento</span>
        </button>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <a href="dashboard.html">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/icons-unified.svg#icon-home"></use>
      </svg>
      <span>Home</span>
    </a>
    <a href="veiculos.html">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/icons-unified.svg#icon-car"></use>
      </svg>
      <span>Veículos</span>
    </a>
    <a href="mapa.html">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/icons-unified.svg#icon-map"></use>
      </svg>
      <span>Mapa</span>
    </a>
    <a href="perfil.html">
      <svg class="icon" aria-hidden="true">
        <use href="../assets/icons/icons-unified.svg#icon-user"></use>
      </svg>
      <span>Perfil</span>
    </a>
  </footer>
</body>

</html>
