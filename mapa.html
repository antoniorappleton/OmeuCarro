<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mapa – L100</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/mapa.css?v=2" />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="js/theme.js"></script>

    <!-- Firebase v9 (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/firestore.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/mapa.js"></script>
  </head>
  <body class="map-page-standalone">
    <!-- HEADER -->
    <header class="map-header">
      <div class="map-header-title">Mapa</div>
      <button
        class="map-header-btn"
        id="btn-search-open"
        aria-label="Pesquisar"
      >
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-search"></use>
        </svg>
      </button>
    </header>

    <!-- MAP LAYER -->
    <div id="map-container">
      <!-- Leaflet injects here -->
    </div>

    <!-- FLOATING CONTROLS -->
    <div class="map-controls-group">
      <button
        class="control-btn"
        id="btn-my-loc"
        aria-label="Minha Localização"
      >
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-location"></use>
        </svg>
      </button>

      <div class="zoom-group">
        <button class="zoom-btn" id="btn-zoom-in" aria-label="Aumentar Zoom">
          <svg class="icon">
            <use href="assets/icons-unified.svg#icon-plus"></use>
          </svg>
        </button>
        <div class="zoom-divider"></div>
        <button class="zoom-btn" id="btn-zoom-out" aria-label="Diminuir Zoom">
          <svg class="icon">
            <use href="assets/icons-unified.svg#icon-minus"></use>
          </svg>
        </button>
      </div>
    </div>

    <!-- FAB ADD -->
    <button class="fab-add" id="fab-add" aria-label="Adicionar Favorito">
      <svg class="icon">
        <use href="assets/icons-unified.svg#icon-plus"></use>
      </svg>
    </button>

    <!-- BOTTOM SHEET -->
    <div class="sheet-container" id="sheet" data-state="compact">
      <div class="sheet-handle-area">
        <div class="sheet-handle-bar"></div>
      </div>
      <div class="sheet-content">
        <!-- VIEW: QUICK (Chips) -->
        <div class="sheet-view active" id="view-quick">
          <div class="details-header u-mb-sm">
            <div class="details-title u-text-base">Favoritos Rápidos</div>
          </div>
          <div class="chips-row" id="quick-chips">
            <div class="chip-skeleton"></div>
            <div class="chip-skeleton"></div>
            <div class="chip-skeleton"></div>
          </div>
        </div>

        <!-- VIEW: DETAILS (Selected) -->
        <div class="sheet-view" id="view-details">
          <div class="details-header">
            <h2 class="details-title" id="det-name">Nome do Local</h2>
            <p class="details-subtitle" id="det-address">
              Endereço completo...
            </p>
          </div>

          <div class="details-actions">
            <!-- Planner Button Removed -->

            <!-- Navigation Button -->
            <a
              class="btn-action-primary full-width u-mb-sm"
              id="btn-navigate"
              target="_blank"
              style="text-decoration: none"
            >
              <svg class="icon u-mr-xs">
                <use href="assets/icons-unified.svg#icon-navigation"></use>
              </svg>
              Navegar
            </a>

            <div class="u-grid-2">
              <button class="btn-action-secondary" id="btn-edit">Editar</button>
              <button
                class="btn-action-secondary u-text-danger"
                id="btn-delete"
              >
                Apagar
              </button>
            </div>
          </div>
        </div>

        <!-- VIEW: FORM (Add/Edit) -->
        <div class="sheet-view" id="view-form">
          <div class="form-header">
            <button class="map-header-btn" id="btn-cancel-form">
              <svg class="icon">
                <use href="assets/icons-unified.svg#icon-arrow-left"></use>
              </svg>
            </button>
            <h3 class="form-title" id="form-heading">Editar Local</h3>
            <div style="width: 40px"></div>
            <!-- Spacer for center alignment -->
          </div>

          <div class="form-content-scroll">
            <!-- Name -->
            <div class="form-group">
              <label class="form-label-row">
                <span class="form-label-text">Nome do Local</span>
              </label>
              <div class="input-with-icon">
                <input
                  type="text"
                  class="form-input-clean"
                  id="inp-name"
                  placeholder="Ex: Casa, Trabalho..."
                />
                <div class="input-icon-right">
                  <svg class="icon">
                    <use href="assets/icons-unified.svg#icon-edit"></use>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Address -->
            <div class="form-group">
              <label class="form-label-row">
                <span class="form-label-text">Endereço</span>
              </label>
              <div class="input-with-icon">
                <input
                  type="text"
                  class="form-input-clean"
                  id="inp-address"
                  placeholder="Pesquisar morada..."
                />
                <div class="input-icon-right">
                  <svg class="icon">
                    <use href="assets/icons-unified.svg#icon-location"></use>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Map Adjust Tip -->
            <div class="form-map-tip">
              <svg class="icon">
                <use href="assets/icons-unified.svg#icon-arrow-up"></use>
              </svg>
              <span>Arraste o mapa para ajustar a posição</span>
            </div>

            <!-- Type Chips -->
            <div class="form-group">
              <label class="form-label-row">
                <span class="form-label-text">Tipo de Local</span>
              </label>
              <div class="type-chips-row" id="type-chips-container">
                <button class="type-chip" data-value="Casa">
                  <svg class="icon">
                    <use href="assets/icons-unified.svg#icon-home"></use>
                  </svg>
                  Casa
                </button>
                <button class="type-chip" data-value="Trabalho">
                  <svg class="icon">
                    <use href="assets/icons-unified.svg#icon-car"></use>
                  </svg>
                  Trabalho
                </button>
                <button class="type-chip active" data-value="Outro">
                  <svg class="icon">
                    <use href="assets/icons-unified.svg#icon-pin"></use>
                  </svg>
                  Outro
                </button>
              </div>
              <input type="hidden" id="inp-category" value="Outro" />
            </div>

            <!-- Notes -->
            <div class="form-group">
              <label class="form-label-row">
                <span class="form-label-text">Observações</span>
              </label>
              <textarea
                class="form-input-area"
                id="inp-notes"
                placeholder="Ex: Portão azul, código 1234..."
              ></textarea>
            </div>
          </div>

          <div class="form-footer">
            <button class="btn-action-primary full-width" id="btn-save-form">
              Guardar Alterações
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SEARCH OVERLAY -->
    <div class="search-overlay" id="search-overlay">
      <div class="search-header">
        <button class="map-header-btn" id="btn-search-close">
          <svg class="icon">
            <use href="assets/icons-unified.svg#icon-arrow-left"></use>
          </svg>
        </button>
        <input
          type="text"
          class="search-input-pill"
          id="search-input"
          placeholder="Pesquisar favoritos..."
        />
      </div>
      <div class="search-results" id="search-results">
        <!-- Items injected here -->
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- MODAL CONFIRM -->
    <div class="modal-backdrop" id="modal-confirm">
      <div class="modal-card">
        <div class="modal-title">Apagar Favorito?</div>
        <div class="modal-text">Esta ação não pode ser desfeita.</div>
        <div class="modal-actions">
          <button class="btn-modal cancel" id="btn-modal-cancel">
            Cancelar
          </button>
          <button class="btn-modal confirm" id="btn-modal-confirm">
            Apagar
          </button>
        </div>
      </div>
    </div>

    <!-- FOOTER NAV -->
    <footer>
      <a href="dashboard.html">
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-home"></use>
        </svg>
        <span>Home</span>
      </a>
      <a href="veiculos.html">
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-car"></use>
        </svg>
        <span>Veículos</span>
      </a>
      <a href="mapa.html" class="active">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons-unified.svg?v=2#icon-map"></use>
        </svg>
        <span>Mapa</span>
      </a>
      <a href="perfil.html">
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-user"></use>
        </svg>
        <span>Perfil</span>
      </a>
    </footer>
  </body>
</html>
