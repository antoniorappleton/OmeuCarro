<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planeador – L100</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <script src="js/theme.js"></script>

    <!-- Firebase v9 (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/firestore.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/planeador.js"></script>
  </head>

  <body class="app-page" data-page="trip-planner">
    <!-- HEADER -->
    <header class="app-header">
      <div class="app-header-left">
        <a
          href="dashboard.html"
          class="app-logo"
          aria-label="Voltar à dashboard"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons-unified.svg#icon-arrow-left"></use>
          </svg>
          <div class="app-logo-text">
            <span class="app-logo-title">L100</span>
            <span class="app-logo-subtitle">Planeador de Viagem</span>
          </div>
        </a>
      </div>

      <div class="app-header-actions">
        <!-- Optional: Profile or other actions -->
      </div>
    </header>

    <main class="app-content">
      <!-- HERO -->
      <section class="vehicle-hero">
        <div class="vehicle-hero-info">
          <h1 class="page-title">Planeador</h1>
          <p class="text-muted">Simule custos e abra a rota.</p>
        </div>
        <div class="vehicle-hero-actions">
          <button
            id="btn-open-destinations"
            class="icon-btn"
            aria-label="Mapa e Destinos"
          >
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-map"></use>
            </svg>
          </button>
          <button
            id="btn-add-destination"
            class="icon-btn"
            aria-label="Adicionar Destino"
          >
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-plus"></use>
            </svg>
          </button>
        </div>
      </section>

      <!-- INPUTS (SIMULATION) -->
      <section class="card" style="margin-bottom: 16px">
        <header class="card-header">
          <h3 class="vehicle-section-title">
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-settings"></use>
            </svg>
            Dados da Viagem
          </h3>
          <button id="btn-use-averages" class="btn btn-sm btn-outline">
            Usar Médias
          </button>
        </header>
        <div class="card-body">
          <div class="form-grid">
            <label>
              <span class="muted">Consumo (L/100km)</span>
              <input
                type="number"
                id="simp-consumption"
                placeholder="Ex: 5.5"
                step="0.1"
                inputmode="decimal"
              />
            </label>
            <label>
              <span class="muted">Preço/Litro (€)</span>
              <input
                type="number"
                id="simp-price"
                placeholder="Ex: 1.70"
                step="0.001"
                inputmode="decimal"
              />
            </label>
            <label>
              <span class="muted">Distância (km)</span>
              <input
                type="number"
                id="simp-distance"
                placeholder="Ex: 150"
                inputmode="numeric"
              />
            </label>
            <label>
              <span class="muted">Nº Viagens</span>
              <input
                type="number"
                id="simp-trips"
                value="1"
                inputmode="numeric"
              />
            </label>
            <label>
              <span class="muted">Portagens (€)</span>
              <input
                type="number"
                id="simp-tolls"
                placeholder="Ex: 12.50"
                step="0.01"
                inputmode="decimal"
              />
            </label>
            <label>
              <span class="muted">Pessoas</span>
              <input
                type="number"
                id="simp-people"
                value="1"
                inputmode="numeric"
              />
            </label>
          </div>
        </div>
      </section>

      <!-- RESULTS -->
      <section class="card" style="margin-bottom: 24px">
        <header class="card-header">
          <h3 class="vehicle-section-title">
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-dashboard"></use>
            </svg>
            Estimativa
          </h3>
        </header>
        <div class="card-body">
          <div class="vehicle-kpis-compact">
            <div class="kpi-item">
              <span class="kpi-label">Total Gasto</span>
              <span class="kpi-value is-primary" id="res-total">0,00 €</span>
            </div>
            <div class="kpi-item">
              <span class="kpi-label">Combustível</span>
              <span class="kpi-value" id="res-fuel-cost">0,00 €</span>
            </div>
            <div class="kpi-item">
              <span class="kpi-label">Portagens</span>
              <span class="kpi-value" id="res-tolls">0,00 €</span>
            </div>
            <div class="kpi-item">
              <span class="kpi-label">Por Pessoa</span>
              <span class="kpi-value" id="res-per-person">0,00 €</span>
            </div>
          </div>
          <div
            style="
              margin-top: 16px;
              font-size: 0.9rem;
              color: var(--color-text-muted);
            "
          >
            Viagem de <strong id="res-km-total">0</strong> km (<span
              id="res-liters"
              >0</span
            >
            litros)
          </div>
        </div>
      </section>

      <!-- ACTIONS -->
      <section style="margin-bottom: 80px">
        <button
          id="btn-open-route"
          class="btn btn-primary full-width"
          style="height: 48px; font-size: 1rem"
        >
          <svg class="icon">
            <use href="assets/icons-unified.svg#icon-map"></use>
          </svg>
          Abrir Rota no Google Maps
        </button>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <a href="dashboard.html">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons-unified.svg#icon-home"></use>
        </svg>
        <span>Home</span>
      </a>
      <a href="veiculos.html">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons-unified.svg#icon-car"></use>
        </svg>
        <span>Veículos</span>
      </a>
      <a href="planeador.html" class="active">
        <svg class="icon">
          <use href="assets/icons-unified.svg#icon-map"></use>
        </svg>
        <span>Planeador</span>
      </a>
      <a href="perfil.html">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons-unified.svg#icon-user"></use>
        </svg>
        <span>Perfil</span>
      </a>
    </footer>

    <!-- DRAWER: DESTINATIONS & MAP -->
    <div id="panel-destinations" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-card">
        <header class="modal-header">
          <h2>Destino e Rota</h2>
          <button id="close-panel-dest" class="icon-btn">
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-close"></use>
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <label style="display: block; margin-bottom: 12px">
            <span class="muted">Selecionar Destino</span>
            <select
              id="sel-destination"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid var(--border-light);
              "
            >
              <option value="">A carregar...</option>
            </select>
          </label>
          <p
            id="dest-address-display"
            class="text-muted"
            style="margin-bottom: 24px; font-size: 0.9rem"
          >
            <!-- Address will appear here -->
          </p>
          <button id="btn-maps-action" class="btn btn-primary full-width">
            Abrir Maps (Navegar)
          </button>
          <button
            id="btn-update-loc"
            class="btn btn-sm btn-outline full-width"
            style="margin-top: 12px"
          >
            Atualizar Localização Atual
          </button>
        </div>
      </div>
    </div>

    <!-- DRAWER: ADD DESTINATION -->
    <div id="panel-add-dest" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-card">
        <header class="modal-header">
          <h2>Novo Destino</h2>
          <button id="close-panel-add" class="icon-btn">
            <svg class="icon">
              <use href="assets/icons-unified.svg#icon-close"></use>
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <label style="display: block; margin-bottom: 12px">
            <span class="muted">Nome do Local</span>
            <input
              id="new-dest-name"
              type="text"
              placeholder="Ex: Casa Praia"
            />
          </label>
          <label style="display: block; margin-bottom: 24px">
            <span class="muted">Endereço (Google Maps)</span>
            <input
              id="new-dest-address"
              type="text"
              placeholder="Ex: Rua das Flores, 123, Lisboa"
            />
          </label>
          <button id="btn-save-dest" class="btn btn-primary full-width">
            Guardar
          </button>
          <p id="msg-add-dest" class="form-message"></p>
        </div>
      </div>
    </div>
  </body>
</html>
