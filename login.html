<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Antonio Appleton - antonioappleton@gmail.com">
  <title>Login - Fuel Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <!-- Firebase SDK v8 (global firebase.*) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Config Firebase (inicializa firebase, cria auth e db) -->
  <script defer src="js/firebase-config.js"></script>

  <!-- Lógica de autenticação -->
  <script defer src="js/auth.js"></script>

</head>

<body data-page="auth">
  <div class="auth-container">
    <h1>Login</h1>

    <!-- IMPORTANTE: o auth.js espera data-page="auth" -->
    <!-- Se preferires, também podes pôr isto no <body> -->
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>

      <!-- Mensagem de erro/sucesso (o auth.js escreve aqui) -->
      <p id="login-message" class="form-message"></p>

      <!-- auth.js faz login no submit -->
      <button type="submit">Entrar</button>

      <!-- reset password (auth.js usa este id) -->
      <button type="button" id="btn-password-reset">Esqueci-me da password</button>
    </form>

    <p>Não tens conta? <a href="register.html">Criar conta</a></p>
    <p style="margin-top: 20px; font-size: 0.75rem; opacity: 0.5;">Dev by Antonio Appleton</p>
  </div>

</body>

</html>
