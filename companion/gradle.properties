org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.7.3 só foi testado oficialmente até compileSdk 35; usamos 36 porque é a
# plataforma mais recente já instalada neste SDK local (evita descarregar a 35
# só para isto). targetSdk fica em 34 (comportamento de runtime testado).
android.suppressUnsupportedCompileSdk=36
